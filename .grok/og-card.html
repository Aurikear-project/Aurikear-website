<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>auriKear card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;1,500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .card {
    position: relative;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(ellipse 90% 70% at 72% 42%, rgba(58,154,181,0.35) 0%, transparent 58%),
      radial-gradient(ellipse 70% 80% at 18% 70%, rgba(12,90,114,0.55) 0%, transparent 55%),
      linear-gradient(150deg, #0c5a72 0%, #1a7a8a 55%, #3a9ab5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-synthesis: none;
  }
  .photo {
    position: absolute;
    inset: 0;
    background:
      url("../public/images/hero-consult.jpg") center / cover no-repeat;
    opacity: 0.28;
    mix-blend-mode: soft-light;
    pointer-events: none;
  }
  .orb-a, .orb-b {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .orb-a { width: 720px; height: 720px; top: -180px; right: -80px; }
  .orb-b { width: 360px; height: 360px; bottom: 40px; left: -80px; }
  .rings {
    position: absolute;
    width: 980px;
    height: 980px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.55;
  }
  .lockup {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #f5fafb;
    padding: 0 280px;
    max-width: 1180px;
  }
  .mark {
    display: block;
    margin: 0 auto 28px;
  }
  .wordmark {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 168px;
    letter-spacing: -2px;
    line-height: 0.95;
    margin: 0;
    color: #f5fafb;
    text-shadow: 0 8px 40px rgba(12, 90, 114, 0.45);
  }
  .tagline {
    font-family: Nunito, "Segoe UI", Arial, sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: 42px;
    letter-spacing: 0.04em;
    color: #e8f6fa;
    margin: 22px 0 0;
    opacity: 0.92;
  }
  .gold {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #e8a948;
    margin-right: 14px;
    vertical-align: middle;
    box-shadow: 0 0 16px rgba(232, 169, 72, 0.7);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="orb-a"></div>
    <div class="orb-b"></div>
    <svg class="rings" viewBox="0 0 980 980" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="490" cy="490" r="220" stroke="#e8f6fa" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="490" cy="490" r="320" stroke="#3a9ab5" stroke-opacity="0.28" stroke-width="2.5"/>
      <circle cx="490" cy="490" r="420" stroke="#e8f6fa" stroke-opacity="0.12" stroke-width="2"/>
    </svg>
    <div class="lockup">
      <svg class="mark" width="54" height="62" viewBox="0 0 30 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 30 C6 30, 26 23, 22 5" stroke="#9dd8e8" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M10 28 C10 28, 22 21, 18 8" stroke="#3a9ab5" stroke-width="2.3" stroke-linecap="round"/>
        <circle cx="19.5" cy="6.5" r="2.2" fill="#e8a948"/>
      </svg>
      <h1 class="wordmark">auriKear</h1>
      <p class="tagline"><span class="gold"></span>Hear for good</p>
    </div>
  </div>
</body>
</html>
